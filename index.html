<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radios locales de Alicante (Onil)</title>
<style>
:root {--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#f1f5f9;--muted:#94a3b8;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:100px}
header{padding:16px;font-size:22px;font-weight:bold}
.tabs{display:flex;gap:10px;padding:0 16px 10px}
.tab{flex:1;padding:10px;background:var(--card);border-radius:12px;text-align:center;cursor:pointer}
.tab.active{background:var(--accent);color:#000;font-weight:bold}
.container{padding:16px}
.search-bar{display:flex;gap:10px;margin-bottom:12px}
input{flex:1;padding:12px;border-radius:12px;border:none;background:var(--card);color:var(--text)}
button{padding:10px 14px;border-radius:12px;border:none;background:var(--accent);font-weight:bold;cursor:pointer}
.radio{background:var(--card);padding:12px;border-radius:16px;margin-bottom:10px}
.radio-header{cursor:pointer}
.radio-body{display:none;margin-top:8px;color:var(--muted)}
.radio.open .radio-body{display:block}
.player{position:fixed;bottom:0;left:0;right:0;background:#020617;border-top:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;gap:12px}
.player-info{flex:1}
.player-info h4{margin:0;font-size:14px}
.player-info span{font-size:12px;color:red}
</style>
</head>
<body>
<header>📻 Radios locales de Alicante (zona Onil)</header>

<div class="tabs">
  <div class="tab active" id="tab-all" onclick="setTab('all')">Inicio</div>
  <div class="tab" id="tab-favs" onclick="setTab('favs')">Favoritas</div>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" id="search" placeholder="Buscar emisora...">
    <button onclick="render()">Buscar</button>
  </div>

  <div id="list"></div>
</div>

<div class="player" id="player" style="display:none;">
  <div class="player-info">
    <h4 id="playerTitle"></h4>
    <span>🔴 EN DIRECTO</span>
  </div>
  <button onclick="togglePlay()">▶ / ❚❚</button>
</div>

<audio id="audio"></audio>

<script>
const radios = [
  // Muy locales / cercanas a Onil
  {id:1,name:"La Fresca FM (Onil)",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://stream.lafresca.fm/live.mp3"},
  {id:2,name:"Radio Alcoy (SER)",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"},
  {id:3,name:"COPE Alcoy",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"http://195.55.74.205/cope/net1-low.mp3"},
  {id:4,name:"Onda Cero Alcoy",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://icecast-streaming.nice264.com/ondacero"},
  {id:5,name:"Radio Villena (SER)",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"},
  {id:6,name:"COPE Villena",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"http://195.55.74.205/cope/net1-low.mp3"},
  {id:7,name:"Radio Elda SER Vinalopó",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"},
  {id:8,name:"COPE Elda Vinalopó",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"http://195.55.74.205/cope/net1-low.mp3"},
  {id:9,name:"Onda Cero Elche",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://icecast-streaming.nice264.com/ondacero"},
  {id:10,name:"Radio Elche (SER)",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"},
  {id:11,name:"Radio San Vicente",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://streaming.radiosanvicente.com/directo.mp3"},
  {id:12,name:"Radio UMH (Elche)",comunidad:"Comunitat Valenciana",provincia:"Alicante",url:"https://radio.umh.es/radio-directo/"},

  // Cercanas a la provincia
  {id:13,name:"La Fresca FM (Murcia)",comunidad:"Región de Murcia",provincia:"Murcia",url:"https://stream.lafresca.fm/live.mp3"}
];

let currentTab = "all";
const audio = document.getElementById("audio");
const favs = JSON.parse(localStorage.getItem("favs") || "[]");

function setTab(tab){
  currentTab=tab;
  document.getElementById("tab-all").classList.remove("active");
  document.getElementById("tab-favs").classList.remove("active");
  document.getElementById("tab-"+tab).classList.add("active");
  render();
}

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=document.getElementById("list");
  list.innerHTML="";
  let data=radios;
  if(currentTab==="favs") data=data.filter(r=>favs.includes(r.id));
  data=data.filter(r=>(!q||r.name.toLowerCase().includes(q)));
  if(!data.length){list.innerHTML="<p style='color:var(--muted)'>No hay resultados</p>";return;}
  data.forEach(r=>{
    const div=document.createElement("div");
    div.className="radio";
    div.innerHTML=`<div class="radio-header" onclick="this.parentElement.classList.toggle('open')"><strong>${r.name}</strong></div>
    <div class="radio-body"><p>${r.comunidad} · ${r.provincia}</p>
    <button onclick="playRadio(${r.id})">▶ Escuchar</button>
    <button onclick="toggleFav(${r.id})">${favs.includes(r.id)?"❤️ Quitar favorito":"🤍 Favorito"}</button></div>`;
    list.appendChild(div);
  });
}

function playRadio(id){
  const r=radios.find(x=>x.id===id);
  audio.src=r.url;
  audio.play();
  document.getElementById("player").style.display="flex";
  document.getElementById("playerTitle").textContent=r.name;
}

function togglePlay(){ if(!audio.src) return; audio.paused?audio.play():audio.pause(); }

function toggleFav(id){
  const i=favs.indexOf(id);
  if(i>=0) favs.splice(i,1); else favs.push(id);
  localStorage.setItem("favs",JSON.stringify(favs));
  render();
}

render();
</script>
</body>
</html>
