<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radios de España (principales + locales)</title>

<style>
:root {--bg:#0f172a;--card:#1e293b;--accent:#38bdf8;--text:#f1f5f9;--muted:#94a3b8;--danger:#ef4444;}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:110px}
header{padding:16px;font-size:22px;font-weight:bold}
.tabs{display:flex;gap:10px;padding:0 16px 10px}
.tab{flex:1;padding:10px;background:var(--card);border-radius:12px;text-align:center;cursor:pointer}
.tab.active{background:var(--accent);color:#000;font-weight:bold}
.container{padding:16px}
.search-bar{display:flex;gap:10px;margin-bottom:12px}
input{flex:1;padding:12px;border-radius:12px;border:none;background:var(--card);color:var(--text)}
button{padding:10px 14px;border-radius:12px;border:none;background:var(--accent);font-weight:bold;cursor:pointer}
.delete-btn{background:var(--danger);color:#fff}
.radio{background:var(--card);padding:12px;border-radius:16px;margin-bottom:10px}
.radio-header{display:flex;align-items:center;gap:10px;cursor:pointer}
.radio-header img{width:42px;height:42px;object-fit:contain;border-radius:8px;background:#020617;padding:4px}
.radio-body{display:none;margin-top:8px;color:var(--muted)}
.radio.open .radio-body{display:block}
.player{position:fixed;bottom:0;left:0;right:0;background:#020617;border-top:1px solid #1e293b;padding:10px 16px;display:flex;align-items:center;gap:12px}
.player-info{flex:1}
.player-info h4{margin:0;font-size:14px}
.player-info span{font-size:12px;color:red}
</style>
</head>
<body>

<header>📻 Radios de España (estables)</header>

<div class="tabs">
  <div class="tab active" id="tab-all" onclick="setTab('all')">Inicio</div>
  <div class="tab" id="tab-favs" onclick="setTab('favs')">Favoritas</div>
</div>

<div class="container">
  <div class="search-bar">
    <input type="text" id="search" placeholder="Buscar emisora...">
    <button onclick="render()">Buscar</button>
  </div>

  <div id="list"></div>
</div>

<div class="player" id="player" style="display:none;">
  <div class="player-info">
    <h4 id="playerTitle"></h4>
    <span>🔴 EN DIRECTO</span>
  </div>
  <button onclick="togglePlay()">▶ / ❚❚</button>
</div>

<audio id="audio"></audio>

<script>
// Lista curada de emisoras principales de España + algunas locales estables
const radiosBase = [
  // PRINCIPALES NACIONALES (muy estables)
  {id:1,name:"Cadena SER",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"},
  {id:2,name:"COPE",url:"http://195.55.74.205/cope/net1-low.mp3"},
  {id:3,name:"Onda Cero",url:"https://icecast-streaming.nice264.com/ondacero"},
  {id:4,name:"RNE Radio 1",url:"https://rtve-mp3.flumotion.com/rne/rne1/mp3/rtve.mp3"},
  {id:5,name:"RNE Radio 3",url:"https://rtve-mp3.flumotion.com/rne/radio3/mp3/rtve.mp3"},
  {id:6,name:"RNE Radio 5",url:"https://rtve-mp3.flumotion.com/rne/radio5/mp3/rtve.mp3"},
  {id:7,name:"Los40",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40.mp3"},
  {id:8,name:"Cadena Dial",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENADIAL.mp3"},
  {id:9,name:"Cadena 100",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENA100.mp3"},
  {id:10,name:"Europa FM",url:"https://live.europafm.com/live/europafm/master.m3u8"},
  {id:11,name:"Kiss FM",url:"https://kp.radiocdn.com/kissfm.mp3"},
  {id:12,name:"Radio Marca",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/RADIOMARCA.mp3"},

  // AUTONÓMICAS ESTABLES
  {id:13,name:"RAC1 (Cataluña)",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/RAC1.mp3"},
  {id:14,name:"Catalunya Ràdio",url:"https://shoutcast.ccma.cat/ccma/catradio.mp3"},
  {id:15,name:"Canal Sur Radio",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CANALSUR.mp3"},
  {id:16,name:"À Punt Ràdio",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/APUNTRADIO.mp3"},
  {id:17,name:"Radio Euskadi",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_EUSKADI.mp3"},
  {id:18,name:"Radio Galega",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/RADIO_GALICIA.mp3"},
  {id:19,name:"IB3 Ràdio",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/IB3RADIO.mp3"},
  {id:20,name:"Radio Canaria",url:"https://playerservices.streamtheworld.com/api/livestream-redirect/RADIOCANARIA.mp3"},

  // LOCALES CURADAS (zona usuario)
  {id:21,name:"La Fresca FM (Onil)",url:"https://stream.lafresca.fm/live.mp3"},
  {id:22,name:"Radio San Vicente",url:"https://streaming.radiosanvicente.com/directo.mp3"},
  {id:23,name:"Onda Regional Murcia",url:"https://streaming.orm.es/live.mp3"}
];

let removed = JSON.parse(localStorage.getItem("removedRadios") || "[]");
let radios = radiosBase.filter(r => !removed.includes(r.id));

let currentTab = "all";
const audio = document.getElementById("audio");
const favs = JSON.parse(localStorage.getItem("favs") || "[]");

function setTab(tab){
  currentTab=tab;
  document.getElementById("tab-all").classList.remove("active");
  document.getElementById("tab-favs").classList.remove("active");
  document.getElementById("tab-"+tab).classList.add("active");
  render();
}

function render(){
  const q=document.getElementById("search").value.toLowerCase();
  const list=document.getElementById("list");
  list.innerHTML="";

  let data = radios;
  if(currentTab==="favs") data = data.filter(r=>favs.includes(r.id));
  data = data.filter(r => !q || r.name.toLowerCase().includes(q));

  if(!data.length){
    list.innerHTML="<p style='color:var(--muted)'>No hay resultados</p>";
    return;
  }

  data.forEach(r=>{
    const div=document.createElement("div");
    div.className="radio";
    div.innerHTML=`
      <div class="radio-header" onclick="this.parentElement.classList.toggle('open')">
        <strong>${r.name}</strong>
      </div>
      <div class="radio-body">
        <button onclick="playRadio(${r.id})">▶ Escuchar</button>
        <button onclick="toggleFav(${r.id})">${favs.includes(r.id)?"❤️ Quitar favorito":"🤍 Favorito"}</button>
        <button class="delete-btn" onclick="deleteRadio(${r.id})">🗑 Eliminar</button>
      </div>
    `;
    list.appendChild(div);
  });
}

function playRadio(id){
  const r=radios.find(x=>x.id===id);
  if(!r || !r.url){ alert("Stream no disponible"); return; }
  audio.src=r.url;
  audio.play();
  document.getElementById("player").style.display="flex";
  document.getElementById("playerTitle").textContent=r.name;
}

function togglePlay(){
  if(!audio.src) return;
  audio.paused ? audio.play() : audio.pause();
}

function toggleFav(id){
  const i=favs.indexOf(id);
  if(i>=0) favs.splice(i,1); else favs.push(id);
  localStorage.setItem("favs",JSON.stringify(favs));
  render();
}

function deleteRadio(id){
  if(!confirm("¿Eliminar esta emisora de tu app?")) return;
  removed.push(id);
  localStorage.setItem("removedRadios", JSON.stringify(removed));
  radios = radios.filter(r => r.id !== id);
  render();
}

render();
</script>
</body>
</html>
