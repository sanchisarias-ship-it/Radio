<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radio España</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #38bdf8;
  --text: #f1f5f9;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 100px;
}

header {
  padding: 16px;
  font-size: 22px;
  font-weight: bold;
}

.tabs {
  display: flex;
  gap: 10px;
  padding: 0 16px 10px;
}

.tab {
  flex: 1;
  padding: 10px;
  background: var(--card);
  border-radius: 12px;
  text-align: center;
  cursor: pointer;
}

.tab.active {
  background: var(--accent);
  color: #000;
  font-weight: bold;
}

.container {
  padding: 16px;
}

.search-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 12px;
}

input, select {
  flex: 1;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: var(--card);
  color: var(--text);
}

button.search-btn {
  padding: 12px 18px;
  border-radius: 12px;
  border: none;
  background: var(--accent);
  font-weight: bold;
  cursor: pointer;
}

.filters {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

.radio {
  background: var(--card);
  padding: 12px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.radio img {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  object-fit: cover;
}

.radio-info {
  flex: 1;
  cursor: pointer;
}

.radio-info h3 {
  margin: 0;
  font-size: 16px;
}

.radio-info p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.heart {
  font-size: 22px;
  cursor: pointer;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #020617;
  border-top: 1px solid #1e293b;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.player img {
  width: 50px;
  height: 50px;
  border-radius: 12px;
}

.player-info {
  flex: 1;
}

.player-info h4 {
  margin: 0;
  font-size: 14px;
}

.player-info span {
  font-size: 12px;
  color: red;
}
</style>
</head>

<body>

<header>📻 Radios de España</header>

<div class="tabs">
  <div class="tab active" id="tab-all" onclick="setTab('all')">Inicio</div>
  <div class="tab" id="tab-favs" onclick="setTab('favs')">Favoritas</div>
</div>

<div class="container">

  <div class="search-bar">
    <input type="text" id="search" placeholder="Buscar emisora...">
    <button class="search-btn" onclick="render()">Buscar</button>
  </div>

  <div class="filters">
    <select id="comunidad" onchange="updateProvincias()">
      <option value="">Comunidad</option>
    </select>

    <select id="provincia">
      <option value="">Provincia</option>
    </select>
  </div>

  <div id="list"></div>
</div>

<div class="player" id="player" style="display:none;">
  <img id="playerImg" src="">
  <div class="player-info">
    <h4 id="playerTitle"></h4>
    <span>🔴 EN DIRECTO</span>
  </div>
  <button onclick="togglePlay()">▶ / ❚❚</button>
</div>

<audio id="audio"></audio>

<script>
const radios = [
  {id:1, name:"Los40 Madrid", desc:"Éxitos del momento", comunidad:"Madrid", provincia:"Madrid", img:"https://upload.wikimedia.org/wikipedia/commons/1/19/Los40_Logo_2020.svg", url:"https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40.mp3"},
  {id:2, name:"Cadena SER Madrid", desc:"Noticias y actualidad", comunidad:"Madrid", provincia:"Madrid", img:"https://upload.wikimedia.org/wikipedia/commons/7/77/Cadena_SER_logo_2021.svg", url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"},
  {id:3, name:"Europa FM Madrid", desc:"Pop y rock", comunidad:"Madrid", provincia:"Madrid", img:"https://upload.wikimedia.org/wikipedia/commons/2/2e/Europa_FM_logo.svg", url:"https://live.europafm.com/live/europafm/master.m3u8"},

  {id:4, name:"RAC1", desc:"Actualidad en Cataluña", comunidad:"Cataluña", provincia:"Barcelona", img:"https://upload.wikimedia.org/wikipedia/commons/6/6b/RAC1_logo.svg", url:"https://playerservices.streamtheworld.com/api/livestream-redirect/RAC1.mp3"},
  {id:5, name:"Catalunya Ràdio", desc:"Radio pública catalana", comunidad:"Cataluña", provincia:"Barcelona", img:"https://upload.wikimedia.org/wikipedia/commons/0/0c/Catalunya_Radio_logo.svg", url:"https://shoutcast.ccma.cat/ccma/catradio.mp3"},

  {id:6, name:"Canal Sur Radio", desc:"Radio de Andalucía", comunidad:"Andalucía", provincia:"Sevilla", img:"https://upload.wikimedia.org/wikipedia/commons/b/b5/Canal_Sur_Radio_logo.svg", url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CANALSUR.mp3"},

  {id:7, name:"Radio Galicia SER", desc:"SER Galicia", comunidad:"Galicia", provincia:"A Coruña", img:"https://upload.wikimedia.org/wikipedia/commons/7/77/Cadena_SER_logo_2021.svg", url:"https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"}
];

let currentTab = "all";
const audio = document.getElementById("audio");
const favs = JSON.parse(localStorage.getItem("favs") || "[]");

function setTab(tab) {
  currentTab = tab;
  document.getElementById("tab-all").classList.remove("active");
  document.getElementById("tab-favs").classList.remove("active");
  document.getElementById("tab-" + tab).classList.add("active");
  render();
}

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const com = document.getElementById("comunidad").value;
  const prov = document.getElementById("provincia").value;

  const list = document.getElementById("list");
  list.innerHTML = "";

  let data = radios;

  if (currentTab === "favs") {
    data = data.filter(r => favs.includes(r.id));
  }

  data = data.filter(r =>
    (!q || r.name.toLowerCase().includes(q)) &&
    (!com || r.comunidad === com) &&
    (!prov || r.provincia === prov)
  );

  if (data.length === 0) {
    list.innerHTML = "<p style='color:var(--muted)'>No hay resultados</p>";
    return;
  }

  data.forEach(radio => {
    const div = document.createElement("div");
    div.className = "radio";
    const isFav = favs.includes(radio.id);

    div.innerHTML = `
      <img src="${radio.img}">
      <div class="radio-info" onclick="playRadio(${radio.id})">
        <h3>${radio.name}</h3>
        <p>${radio.desc} · ${radio.provincia}</p>
      </div>
      <div class="heart" onclick="toggleFav(${radio.id})">
        ${isFav ? "❤️" : "🤍"}
      </div>
    `;
    list.appendChild(div);
  });
}

function playRadio(id) {
  const radio = radios.find(r => r.id === id);
  audio.src = radio.url;
  audio.play();
  document.getElementById("player").style.display = "flex";
  document.getElementById("playerImg").src = radio.img;
  document.getElementById("playerTitle").textContent = radio.name;
}

function togglePlay() {
  if (!audio.src) return;
  audio.paused ? audio.play() : audio.pause();
}

function toggleFav(id) {
  const index = favs.indexOf(id);
  if (index >= 0) favs.splice(index, 1);
  else favs.push(id);

  localStorage.setItem("favs", JSON.stringify(favs));
  render();
}

function initFilters() {
  const comunidades = [...new Set(radios.map(r => r.comunidad))];
  const comSelect = document.getElementById("comunidad");
  comunidades.forEach(c => {
    const opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    comSelect.appendChild(opt);
  });
}

function updateProvincias() {
  const com = document.getElementById("comunidad").value;
  const provSelect = document.getElementById("provincia");
  provSelect.innerHTML = '<option value="">Provincia</option>';

  const provincias = radios.filter(r => r.comunidad === com).map(r => r.provincia);
  [...new Set(provincias)].forEach(p => {
    const opt = document.createElement("option");
    opt.value = p;
    opt.textContent = p;
    provSelect.appendChild(opt);
  });
}

initFilters();
render();
</script>

</body>
</html>
