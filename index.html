<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radio App</title>

<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --accent: #38bdf8;
  --text: #f1f5f9;
  --muted: #94a3b8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  padding-bottom: 90px;
}

header {
  padding: 16px;
  font-size: 22px;
  font-weight: bold;
}

input {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: none;
  background: var(--card);
  color: var(--text);
  margin-bottom: 16px;
}

.container {
  padding: 16px;
}

.radio {
  background: var(--card);
  padding: 12px;
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
  cursor: pointer;
}

.radio img {
  width: 60px;
  height: 60px;
  border-radius: 12px;
  object-fit: cover;
}

.radio-info {
  flex: 1;
}

.radio-info h3 {
  margin: 0;
  font-size: 16px;
}

.radio-info p {
  margin: 4px 0 0;
  font-size: 13px;
  color: var(--muted);
}

.heart {
  font-size: 20px;
  cursor: pointer;
}

.player {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: #020617;
  border-top: 1px solid #1e293b;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.player img {
  width: 50px;
  height: 50px;
  border-radius: 12px;
}

.player-info {
  flex: 1;
}

.player-info h4 {
  margin: 0;
  font-size: 14px;
}

.player-info span {
  font-size: 12px;
  color: red;
}

button {
  background: var(--accent);
  border: none;
  border-radius: 999px;
  padding: 10px 16px;
  font-weight: bold;
  cursor: pointer;
}
</style>
</head>

<body>

<header>📻 Radio</header>

<div class="container">
  <input type="text" id="search" placeholder="Buscar emisora..." oninput="render()" />

  <div id="list"></div>
</div>

<div class="player" id="player" style="display:none;">
  <img id="playerImg" src="">
  <div class="player-info">
    <h4 id="playerTitle"></h4>
    <span>🔴 EN DIRECTO</span>
  </div>
  <button onclick="togglePlay()">▶ / ❚❚</button>
</div>

<audio id="audio"></audio>

<script>
const radios = [
  {
    id: 1,
    name: "Los40",
    desc: "Éxitos del momento",
    img: "https://upload.wikimedia.org/wikipedia/commons/1/19/Los40_Logo_2020.svg",
    url: "https://playerservices.streamtheworld.com/api/livestream-redirect/LOS40.mp3"
  },
  {
    id: 2,
    name: "Cadena SER",
    desc: "Noticias y actualidad",
    img: "https://upload.wikimedia.org/wikipedia/commons/7/77/Cadena_SER_logo_2021.svg",
    url: "https://playerservices.streamtheworld.com/api/livestream-redirect/CADENASER.mp3"
  },
  {
    id: 3,
    name: "Europa FM",
    desc: "Música pop y rock",
    img: "https://upload.wikimedia.org/wikipedia/commons/2/2e/Europa_FM_logo.svg",
    url: "https://live.europafm.com/live/europafm/master.m3u8"
  }
];

let current = null;
const audio = document.getElementById("audio");
const favs = JSON.parse(localStorage.getItem("favs") || "[]");

function render() {
  const q = document.getElementById("search").value.toLowerCase();
  const list = document.getElementById("list");
  list.innerHTML = "";

  radios.filter(r => r.name.toLowerCase().includes(q)).forEach(radio => {
    const div = document.createElement("div");
    div.className = "radio";

    const isFav = favs.includes(radio.id);

    div.innerHTML = `
      <img src="${radio.img}">
      <div class="radio-info" onclick="playRadio(${radio.id})">
        <h3>${radio.name}</h3>
        <p>${radio.desc}</p>
      </div>
      <div class="heart" onclick="toggleFav(${radio.id})">
        ${isFav ? "❤️" : "🤍"}
      </div>
    `;
    list.appendChild(div);
  });
}

function playRadio(id) {
  const radio = radios.find(r => r.id === id);
  current = radio;

  audio.src = radio.url;
  audio.play();

  document.getElementById("player").style.display = "flex";
  document.getElementById("playerImg").src = radio.img;
  document.getElementById("playerTitle").textContent = radio.name;
}

function togglePlay() {
  if (!audio.src) return;
  audio.paused ? audio.play() : audio.pause();
}

function toggleFav(id) {
  const index = favs.indexOf(id);
  if (index >= 0) favs.splice(index, 1);
  else favs.push(id);

  localStorage.setItem("favs", JSON.stringify(favs));
  render();
}

render();
</script>

</body>
</html>
