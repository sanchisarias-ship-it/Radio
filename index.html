<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Radio Explorer</title>

<!-- Iconos correctos para iOS y Android -->
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<link rel="icon" sizes="192x192" href="icon-192.png">
<link rel="icon" sizes="512x512" href="icon-512.png">
<meta name="theme-color" content="#000000">

<style>
:root {
  --bg:#000000;
  --card:#0b0b0b;
  --text:#ffffff;
  --muted:#9ca3af;
}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--text);padding-bottom:110px}
header{padding:16px;font-size:22px;font-weight:bold}
.tabs{display:flex;gap:10px;padding:0 16px 10px}
.tab{flex:1;padding:10px;background:var(--card);border-radius:12px;text-align:center;cursor:pointer;border:1px solid #111}
.tab.active{background:#fff;color:#000;font-weight:bold}
.container{padding:16px}
.radio{background:var(--card);padding:12px;border-radius:16px;margin-bottom:10px;border:1px solid #111}
button{padding:10px 14px;border-radius:12px;border:1px solid #111;background:#fff;color:#000;font-weight:bold;cursor:pointer}
.player{position:fixed;bottom:0;left:0;right:0;background:#000;border-top:1px solid #111;padding:10px 16px;display:flex;align-items:center;gap:12px}
</style>
</head>
<body>

<header>📻 Radio Explorer</header>

<div class="container">
  <p>App lista con iconos correctos para pantalla de inicio.</p>
</div>

</body>
</html>
